server {
    listen 0.0.0.0:${LISTEN_PORT} default_server;
    listen [::]:${LISTEN_PORT} ipv6only=on default_server;
    server_name _;

    client_max_body_size 16m;

    # Railway healthcheck: 直接 nginx 响应，避免等 uvicorn 启动完
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}';
    }

    location /novnc/ {
        proxy_pass http://127.0.0.1:${NOVNC_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /websockify {
        proxy_pass http://127.0.0.1:${NOVNC_PORT}/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://127.0.0.1:${APP_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
