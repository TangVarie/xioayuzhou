# 只记录方法 + 路径（$uri 不含查询串），不记录 $request/$args/$referer——否则
# 管理端 ?token=xxx 会明文进入 nginx access log（uvicorn 侧的打码过滤器管不到 nginx）。
log_format noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 0.0.0.0:${LISTEN_PORT} default_server;
    listen [::]:${LISTEN_PORT} ipv6only=on default_server;
    server_name _;

    access_log /var/log/nginx/access.log noquery;
    client_max_body_size 16m;

    # Railway healthcheck: 代理到 FastAPI 的 /healthz，这样 uvicorn 崩了
    # healthcheck 会真的失败，Railway 才会重启/不切流量；healthcheckTimeout 已设 300s，
    # 足够覆盖 uvicorn 冷启动加载 Playwright 的时间。
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:${APP_PORT}/healthz;
        proxy_set_header Host $host;
    }

    # noVNC 静态页 + WS 隧道：x11vnc 是 -nopw，所以这里必须用 admin token 守门，
    # 否则登录的 10 分钟窗口内，任何人访问 /websockify 都能接管那个共享浏览器会话。
    # token 由 /admin/login 页面（FastAPI 校验过 ?token 后）写进 vnc_token cookie，
    # 浏览器在 iframe / WS 握手时自动带上。
    location /novnc/ {
        if ($cookie_vnc_token != "${ADMIN_TOKEN}") { return 403; }
        proxy_pass http://127.0.0.1:${NOVNC_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /websockify {
        if ($cookie_vnc_token != "${ADMIN_TOKEN}") { return 403; }
        proxy_pass http://127.0.0.1:${NOVNC_PORT}/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://127.0.0.1:${APP_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
