[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ── 始终运行：webhook 监听 + 反向代理（内存很小）──────────────────
[program:fastapi]
command=/usr/local/bin/uvicorn app.main:app --host 127.0.0.1 --port %(ENV_APP_PORT)s
directory=/app
environment=DISPLAY=%(ENV_DISPLAY)s
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 按需运行：noVNC 虚拟桌面，只在 /admin/login 点"启动浏览器"时拉起 ──
# autostart=false => 平时不占内存。app/login_session.py 用 supervisorctl 控制。
[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 1440x900x24 -ac +extension RANDR
autostart=false
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=%(ENV_DISPLAY)s
autostart=false
autorestart=true
priority=110
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -nopw -listen localhost -xkb -ncache 10 -forever -shared -rfbport 5900
autostart=false
autorestart=true
priority=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify]
command=/usr/bin/websockify --web=/usr/share/novnc %(ENV_NOVNC_PORT)s localhost:5900
autostart=false
autorestart=true
priority=130
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
